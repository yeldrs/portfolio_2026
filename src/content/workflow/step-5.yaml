# Step 5: Test and release. Text: workflow/content.yml. Media (media:) lives here.
order: 5
teaserTools:
  - "github"
  - "vercel"
  - "google-play"
  - "app-store"
en:
  title: "Testing and releasing"
  globalText: "Before pushing a change made by an agent to production, I test it on a secondary branch. I run a quality assurance review, the design QA, comparing the coded version with my design. I log each gap as a comment, through Vercel or GitHub, to turn them into backlog tasks."
  blocks:
    - project: "tenon"
      heading: "Tests and accessibility"
      points:
        - "Automated tests cover the game rules, layout, font sizes and touch targets. People close to me tested the game before release, to check that the rules were understood, the interface was easy to use and the visual style worked."
        - "Contrast is computed from the tokens: the exceptions I accepted are decided and documented. I ran captures through a color-blindness simulation. Pegs also differ by shape, shadow and an engraved symbol."
      tools: []
    - project: "tenon"
      heading: "Release"
      points:
        - "On the Play Store since November 10, 2026, in early access and open to everyone."
        - "The next release will include monetization through AdMob. It builds on the puzzle's retry loop, without pushing players or getting in the way of the game."
      tools:
        - label: "Google Play Console"
      correction: "The first two exports had minor bugs that did not show in the Godot simulator. I now always test with exported APK files."
      link: "https://play.google.com/store/apps/details?id=com.slowgrain.tenon"
      linkLabel: "Google Play listing"
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      points:
        - "GitHub lets me push the site to production on my own domain. Separate branches let me test before releasing to the main branch, which is tied to my domain. On the SEO side: canonical URLs, language alternates, Open Graph and structured data."
        - "After testing several analytics tools, I kept Umami: it is lighter and does not collect private data, so it suits a low-traffic portfolio better."
        - "Over six months (May to November 2026), 75% of visits arrive directly, probably through the UTM links in my résumés, and 17% through organic search. Since the site was translated into French in July 2026, France went from 6% to 20% of traffic. The United States stay around 50%."
      tools:
        - label: "GitHub Pages"
        - label: "Umami"
        - label: "Google Search Console"
      correction: "The accessibility audit I ran with Claude Code let me improve contrast, skip links, keyboard navigation and reduced motion."
fr:
  title: "Tests et mise en ligne"
  globalText: "Avant d'envoyer en production un changement fait par un agent, je le teste sur une branche secondaire. Je fais une revue d'assurance qualité, la QA design, en comparant la version codée à mon design. Je note chaque écart en commentaire, via Vercel ou GitHub, pour en faire des tâches au backlog."
  blocks:
    - project: "tenon"
      heading: "Tests et accessibilité"
      points:
        - "Des tests automatiques couvrent les règles du jeu, la mise en page, les tailles de police et les cibles tactiles. Des proches ont testé le jeu avant la publication pour valider la compréhension des règles, l'ergonomie de l'interface ainsi que le style visuel du jeu."
        - "Le contraste est calculé depuis les tokens : les exceptions assumées sont tranchées et documentées. J'ai passé des captures dans une simulation de daltonisme. Les pions se distinguent aussi par leur forme, leur ombre et un symbole gravé."
      tools: []
    - project: "tenon"
      heading: "Publication"
      points:
        - "Disponible sur le Play Store depuis le 10 novembre 2026, en accès anticipé, ouvert à tous."
        - "La prochaine release contiendra la monétisation via AdMob. Elle s'appuie sur le principe d'itération de résolution de casse-tête, sans insister ni gêner le jeu."
      tools:
        - label: "Google Play Console"
      correction: "Les deux premiers exports contenaient des bugs mineurs non visibles sur le simulateur Godot. Il faut systématiquement tester avec des paquets APK exportés."
      link: "https://play.google.com/store/apps/details?id=com.slowgrain.tenon"
      linkLabel: "Fiche Google Play"
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      points:
        - "GitHub me permet de pousser le site en production sur mon propre domaine. Les différentes branches me laissent tester avant de passer en production sur la branche principale, liée à mon domaine. Côté SEO : URL canoniques, alternatives de langue, Open Graph et données structurées."
        - "Après avoir testé plusieurs outils de suivi analytique, j'ai gardé Umami : plus léger, il ne collecte pas de données privées, donc plus adapté à un portfolio à faible trafic."
        - "Sur six mois (mai à novembre 2026), 75 % des visites arrivent en direct, probablement via les liens UTM de mes CV, et 17 % par recherche organique. Depuis la traduction du site en français en juillet 2026, la France est passée de 6 % à 20 % du trafic. Les États-Unis restent autour de 50 %."
      tools:
        - label: "GitHub Pages"
        - label: "Umami"
        - label: "Google Search Console"
      correction: "L'audit d'accessibilité que j'ai piloté avec Claude Code m'a permis d'améliorer les contrastes, les liens d'évitement, la navigation au clavier et la réduction des animations."
