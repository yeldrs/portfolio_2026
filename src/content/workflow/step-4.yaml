# Step 4: Build. Text: workflow/content.yml. Media (media:) lives here.
order: 4
teaserTools:
  - "claude-code"
  - "opencode"
  - "gemini"
  - "godot"
en:
  title: "Build"
  globalText: "I write the brief and the acceptance criteria, then review. I check every result in the product itself, not only in the code. When an agent gets something wrong, the lesson becomes a rule."
  blocks:
    - project: "tenon"
      points:
        - "Godot, driven mostly with Claude Code at first, then with DeepSeek and Gemini."
        - "One screen at a time, with stops and before and after captures. I validate on a real phone before moving to the next screen."
        - "I wrote no application code by hand. My technical work was auditing and checking."
      tools:
        - label: "Claude Code"
        - label: "OpenCode"
        - label: "Godot"
        - label: "DeepSeek"
        - label: "Gemini"
      correction: "I had built two renders, 2D and 3D. The 3D one weighed down the rendering and testers saw no point in it, so I removed it and replaced it with free peg movement."
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      points:
        - "My Claude Code agent reads the repository in real time and follows my constraint files, my context and my skills."
        - "A skill formats my project writing as YAML. The agent only structures the text, which stays editable by hand at any time."
      tools:
        - label: "Claude Code"
        - label: "OpenCode"
        - label: "Claude"
        - label: "Astro"
        - label: "Tailwind CSS"
fr:
  title: "Développement"
  globalText: "J'écris le brief et les critères d'acceptation, puis je relis. Je vérifie chaque résultat dans le produit lui-même, pas seulement dans le code. Quand un agent se trompe, la leçon devient une règle."
  blocks:
    - project: "tenon"
      points:
        - "Godot, piloté surtout avec Claude Code au départ, puis avec DeepSeek et Gemini."
        - "Un écran à la fois, avec des arrêts et des captures avant et après. Je valide sur un vrai téléphone avant de passer au suivant."
        - "Je n'ai écrit aucun code applicatif à la main. Mon travail technique fut l'audit et la vérification."
      tools:
        - label: "Claude Code"
        - label: "OpenCode"
        - label: "Godot"
        - label: "DeepSeek"
        - label: "Gemini"
      correction: "J'avais construit deux rendus, 2D et 3D. La 3D alourdissait le rendu, et les testeurs n'en voyaient pas l'intérêt. Je l'ai donc retirée et remplacée par le déplacement libre des pions."
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      points:
        - "Mon agent Claude Code lit le dépôt en temps réel et suit mes fichiers de contraintes, mon contexte et mes skills."
        - "Un skill me permet de formater en YAML la rédaction de mes projets. L'agent ne fait que structurer le texte, qui reste modifiable à la main à tout moment."
      tools:
        - label: "Claude Code"
        - label: "OpenCode"
        - label: "Claude"
        - label: "Astro"
        - label: "Tailwind CSS"
