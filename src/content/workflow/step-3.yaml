    - project: portfolio
      heading: "Hi-fi et design system"
      approachLabel: "De Figma à un seul fichier de tokens"
      approach: "Le design system a été construit à la main dans Figma, exporté, puis consolidé dans un seul fichier de tokens : primitives, rôles sémantiques, puis Tailwind. Les fichiers d'export Figma ont été supprimés une fois que le code contenait les valeurs. La décision difficile a été de choisir quelles variables Figma deviennent des primitives, lesquelles deviennent des rôles sémantiques, et ce que les composants ont le droit de référencer. Un script génère maintenant un bundle de design system à partir du même fichier pour Claude Design."
      tools:
        - { id: figma, label: "Figma", note: "design system fait main, export" }
        - { label: "Figma MCP" }
        - { id: claude-code, label: "Claude Code" }
        - { id: tailwind, label: "Tailwind CSS 3", note: "config depuis le fichier de tokens" }
        - { id: claude-design, label: "Claude Design", note: "bundle de design system" }
      constraints: "Une seule chaîne : tokens, rôles sémantiques, config Tailwind, composants. Pas de seconde table de couleurs."
      correction: "Quelques restes subsistent, suivis et non cachés : des classes qui ne rendent rien (text-md, mt-7xl, et une classe de bordure qui utilise un mauvais nom de token) et quelques valeurs codées en dur dans la visionneuse d'images et le pied de page."
