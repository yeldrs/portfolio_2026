# Step 3: Design. Text: workflow/content.yml. Media (media:) lives here.
order: 3
teaserTools:
  - "figma"
  - "claude-design"
  - "gemini"
  - "tailwind"
en:
  title: "Design"
  globalText: "Wireframes come first and fix the structure and states of each screen. The design system lives in one place that the code reads, the design tokens, and is never hardcoded in components."
  blocks:
    - project: "tenon"
      heading: "Wireframes"
      points:
        - "I listed the pages, their content and the features, then generated wireframes from that. From the wireframes I drew up the list of components for the UI kit."
      tools:
        - label: "Claude Design"
      media:
        - gallery: "rail"
          screens:
            - caption: "Game screen"
              src: "tenon-wire-game.webp"
              alt: "Low-fidelity wireframe of the game screen: a menu button and a timer at the top, the diamond-shaped board of yellow and red pegs, and a move counter with undo and redo at the bottom."
            - caption: "Pause and quit"
              src: "tenon-wire-pause.webp"
              alt: "Wireframe of the quit dialog over the dimmed game screen, with Cancel and Quit buttons."
            - caption: "Settings"
              src: "tenon-wire-settings.webp"
              alt: "Wireframe of the settings screen with sound, volume, vibration, language, reduced animations, highlighted legal moves, view and a reset-progress button."
            - caption: "Teaser"
              src: "tenon-wire-soon.webp"
              alt: "Wireframe of the coming-soon screen: an image placeholder, a title, an email field with an invalid address message and a notify button."
    - project: "tenon"
      heading: "Hi-fidelity UI design"
      points: []
      tools: []
      media:
        - gallery: "spotlight"
          screens:
            - caption: "Game screen"
              sub: "Empty board, timer, move counter"
              src: "tenon-final-game.webp"
              theme: "dark"
              alt: "Final game screen: yellow and red pegs on a wooden board, a menu button and the timer at the top, the move counter with undo and redo at the bottom."
            - caption: "Pause and quit"
              sub: "Dialog over the dimmed board"
              src: "tenon-final-pause.webp"
              theme: "dark"
              alt: "Final pause dialog over the dimmed game screen, titled Paused, with Resume, Rules, settings and Home buttons."
            - caption: "Settings"
              sub: "Sound, music, language, hints"
              src: "tenon-final-settings.webp"
              theme: "dark"
              alt: "Final settings screen on a wood background: sound effects, effects volume, music, music volume, visual hints and a language switch, with links to replay the tutorial and more games."
            - caption: "Teaser"
              sub: "Email sign-up"
              src: "tenon-final-soon.webp"
              theme: "dark"
              alt: "Final coming-soon screen: the tenon logo, the text More puzzles coming soon, an email field, a Notify me button and a No thanks link."
            - caption: "Home"
              sub: "Play, rules, credits"
              src: "tenon-hifi-home.webp"
              theme: "dark"
              alt: "Tenon home screen on a wood background: the tenon logo, a Play button, Rules and settings buttons and a Credits button."
            - caption: "Mid-game"
              sub: "Move 6, timer 00:16"
              src: "tenon-hifi-midgame.webp"
              theme: "dark"
              alt: "Tenon game board mid-game: yellow and red pegs on a wooden board, one red peg selected next to the empty space, timer at the top, move counter with undo and redo at the bottom."
    - project: "tenon"
      heading: "Design system kit"
      points:
        - "I gathered the Material Design 3 library, Android's design system, on GitHub so my agents can read it. For the visual direction, I started from royalty-free textures and reworked them with tokens that translate wood species into an interface language. I laid these textures over Material 3's native components: raw wood with a thin high-tech layer. The UI kit is tailored to Android, highly customized and consistent across the whole interface."
      tools:
        - label: "Claude Design"
        - label: "Claude Code"
        - label: "Godot"
        - label: "GitHub"
      correction: "Keeping the visual direction consistent across every interface component was hard. I built an interactive space to browse the UI kit, with a comment area handled by a dedicated AI agent. Thanks to the tokens and the validated constraints, the design system now grows without friction."
      media:
        - gallery: "spotlight"
          screens:
            - caption: "UI kit"
              src: "tenon-uikit.webp"
              theme: "dark"
              device: "desktop"
              alt: "Tenon design system page in the game's debug window: wood roles, buttons in their normal, pressed and disabled states, pictograms, and a comment panel on the right."
    - project: "tenon"
      heading: "Rules, onboarding and reflective pause"
      points:
        - "A rules sheet in the settings, and a visual aid showing legal moves that can be switched off."
        - "A three-step onboarding explains the goal and the three rules. It can be replayed from the settings, and it runs on a simulation board so it doesn't spoil the start of the solution."
        - "Reflective pause: you can move the pegs freely along two axes and throw them, with sound effects. It doesn't count as a move, and the peg returns on its own."
      tools: []
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      heading: "Wireframes"
      points: []
      tools: []
      media:
        - gallery: "rail"
          screens:
            - caption: "Case-study page"
              src: "portfolio-wire-case-desktop.png"
              device: "desktop"
              alt: "Desktop wireframe of the portfolio case-study page on a grid: the Yassine El Idrissi navigation, the title, the Diagnosis heading, the Context, Problem, Role and Key insights blocks next to image placeholders, then a carousel and the Conception and Results sections."
            - caption: "Same page, on a phone"
              src: "portfolio-wire-case-phone.png"
              device: "phone"
              alt: "Phone wireframe of the same case-study page: the Yassine El Idrissi bar with its menu button, the title, Diagnosis, then the Context, Problem, Role and Key insights blocks stacked above image placeholders and the contact block."
    - project: "portfolio"
      heading: "Hi-fidelity UI design"
      points:
        - "I produced the wireframes and high-fidelity mockups in Figma, along with the design system, the UI kit and the tokens. The site is mobile first, but designed to be responsive for presentations on a laptop. Components are therefore built for every device (mobile, tablet, desktop)."
      tools:
        - label: "Figma"
        - label: "Figma MCP"
        - label: "Claude Code"
        - label: "Claude Design"
        - label: "Gemini"
      correction: "At first, the screenshots of my mockups that I gave Gemini lost part of the visual information, because it had no API or MCP access to Figma. An export of my tokens as JSON made up for some of it, but gaps remained because of the lost context. I fixed them by moving to Claude Code, with the Figma MCP integration."
      media:
        - gallery: "spotlight"
          screens:
            - caption: "Home"
              sub: "Desktop, the case-study entry point"
              src: "portfolio-hifi-home-desktop.webp"
              device: "desktop"
              alt: "Portfolio home page in a desktop window: the Yassine El Idrissi header, then the title Hello, I'm Yassine, the introduction and the Case studies button over a pale background."
            - caption: "Case-study cards"
              sub: "Desktop, the projects list, in French"
              src: "portfolio-hifi-cards-desktop.webp"
              device: "desktop"
              alt: "Projects list in French on desktop: the Caisse des Dépôts card with its workshop photo, the title Concevoir un outil agile pour designer avec éthique, the client, the description and the role, the Voir le projet button, then the next card starting below."
            - caption: "Case study, 900.care"
              sub: "Tablet, the long read"
              src: "portfolio-hifi-case-tablet.webp"
              device: "tablet"
              alt: "900.care case study on a tablet: the title UX and growth for a sustainable e-commerce, then the Context, Problem, Role and Key insights sections with their illustrations."
            - caption: "Same page, on a phone"
              sub: "Phone, the case study in one column"
              src: "portfolio-hifi-case-phone.webp"
              device: "phone"
              alt: "The same 900.care case study on a phone: the Yassine El Idrissi bar with its menu button, the title UX and growth for a sustainable e-commerce, the Diagnosis heading, then the Context and Problem paragraphs stacked in one column."
            - caption: "About"
              sub: "Phone, resume and contact"
              src: "portfolio-hifi-about-phone.webp"
              device: "phone"
              alt: "Portfolio About page on a phone: the Product designer title, the introduction, the Let's connect button, then the Experience heading with the first role and the dates."
            - caption: "Contact"
              sub: "Phone, the footer call to action"
              src: "portfolio-hifi-footer-phone.webp"
              device: "phone"
              alt: "Page footer on a phone in French: the Discutons heading, the collaboration line, the button with the contact email, then the copyright and the LinkedIn link."
          figure:
            src: "portfolio-hifi-tokens.png"
            caption: "Figma variables"
            sub: "Primitive and semantic collections behind the tokens file"
            alt: "Figma Variables panel on the Semantic collection: the Collections column lists Primitive with 123 variables and Semantic with 71, grouped by colors (stroke, background, text), border, radius, width, spacing and layout. The stroke group maps stroke-primary to colors/blue-chill/400, stroke-tertiary to colors/neutral/50 and stroke-neutral-primary to colors/neutral/300."

fr:
  title: "Design"
  globalText: "Les wireframes passent en premier et fixent la structure et les états de chaque écran. Le design system vit à un seul endroit que le code lit, les design tokens, et n'est jamais écrit en dur dans les composants."
  blocks:
    - project: "tenon"
      heading: "Wireframes"
      points:
        - "J'ai listé les pages, leur contenu ainsi que les fonctionnalités, afin de générer des wireframes. J'en ai tiré une liste des composants pour l'UI kit."
      tools:
        - label: "Claude Design"
      media:
        - gallery: "rail"
          screens:
            - caption: "Écran de jeu"
              src: "tenon-wire-game.webp"
              alt: "Wireframe basse fidélité de l'écran de jeu : un bouton de menu et un chrono en haut, le plateau en losange de pions jaunes et rouges, et un compteur de coups avec annuler et rétablir en bas."
            - caption: "Pause et abandon"
              src: "tenon-wire-pause.webp"
              alt: "Wireframe de la boîte de dialogue pour quitter, sur l'écran de jeu assombri, avec les boutons Annuler et Quitter."
            - caption: "Réglages"
              src: "tenon-wire-settings.webp"
              alt: "Wireframe de l'écran de réglages avec son, volume, vibrations, langue, réduction des animations, coups légaux en surbrillance, vue et un bouton de réinitialisation de la progression."
            - caption: "Teaser"
              src: "tenon-wire-soon.webp"
              alt: "Wireframe de l'écran « bientôt » : un emplacement d'image, un titre, un champ e-mail avec un message d'adresse invalide et un bouton pour être prévenu."
    - project: "tenon"
      heading: "Interface haute fidélité"
      points: []
      tools: []
      media:
        - gallery: "spotlight"
          screens:
            - caption: "Écran de jeu"
              sub: "Plateau vide, chrono, compteur de coups"
              src: "tenon-final-game.webp"
              theme: "dark"
              alt: "Écran de jeu final : des pions jaunes et rouges sur un plateau en bois, un bouton de menu et le chrono en haut, le compteur de coups avec annuler et rétablir en bas."
            - caption: "Pause et abandon"
              sub: "Boîte de dialogue sur le plateau assombri"
              src: "tenon-final-pause.webp"
              theme: "dark"
              alt: "Boîte de dialogue de pause finale sur l'écran de jeu assombri, intitulée Paused, avec les boutons Resume, Rules, réglages et Home."
            - caption: "Réglages"
              sub: "Son, musique, langue, aides"
              src: "tenon-final-settings.webp"
              theme: "dark"
              alt: "Écran de réglages final sur fond bois : effets sonores, volume des effets, musique, volume de la musique, aides visuelles et sélecteur de langue, avec des liens pour rejouer le tutoriel et voir plus de jeux."
            - caption: "Teaser"
              sub: "Inscription par e-mail"
              src: "tenon-final-soon.webp"
              theme: "dark"
              alt: "Écran final « bientôt » : le logo tenon, le texte More puzzles coming soon, un champ e-mail, un bouton Notify me et un lien No thanks."
            - caption: "Accueil"
              sub: "Jouer, règles, crédits"
              src: "tenon-hifi-home.webp"
              theme: "dark"
              alt: "Écran d'accueil de Tenon sur fond bois : le logo tenon, un bouton Play, des boutons Rules et réglages et un bouton Credits."
            - caption: "En cours de partie"
              sub: "Coup 6, chrono 00:16"
              src: "tenon-hifi-midgame.webp"
              theme: "dark"
              alt: "Plateau de jeu Tenon en cours de partie : des pions jaunes et rouges sur un plateau en bois, un pion rouge sélectionné près de la case vide, le chrono en haut, le compteur de coups avec annuler et rétablir en bas."
    - project: "tenon"
      heading: "Design system kit"
      points:
        - "J'ai rassemblé la bibliothèque Material Design 3, le design system d'Android, sur GitHub pour que mes agents la lisent. Pour la direction visuelle, je suis parti de textures libres de droit que j'ai modifiées à partir de tokens mis en place pour traduire les essences de bois en langage d'interface. J'ai posé ces textures sur les composants natifs de Material 3. Du bois brut, avec une fine couche high-tech. L'UI kit est adapté à Android, hautement personnalisé et cohérent sur l'ensemble de l'interface."
      tools:
        - label: "Claude Design"
        - label: "Claude Code"
        - label: "Godot"
        - label: "GitHub"
      correction: "Il était difficile de concevoir et de maintenir une direction visuelle cohérente sur tous les composants de l'interface. J'ai donc construit un espace interactif pour visualiser l'UI kit, avec un espace de commentaires traités par un agent IA dédié. Le design system s'étend désormais naturellement grâce aux tokens et aux contraintes validées."
      media:
        - gallery: "spotlight"
          screens:
            - caption: "UI kit"
              src: "tenon-uikit.webp"
              theme: "dark"
              device: "desktop"
              alt: "Page du design system de Tenon dans la fenêtre de debug du jeu : rôles de bois, boutons dans leurs états normal, pressé et désactivé, pictos, et un panneau de commentaires à droite."
    - project: "tenon"
      heading: "Règles, onboarding et pause réflexive"
      points:
        - "Une feuille de règles dans les paramètres, et une aide visuelle des coups légaux qu'on peut désactiver."
        - "Un onboarding en trois étapes explique le but et les trois règles. On peut le relancer depuis les paramètres. Il se joue sur une planche de simulation, pour ne pas spoiler le début de la solution."
        - "Pause réflexive : on déplace les pions librement sur deux axes et on peut les lancer, avec des sons. Ça ne compte pas comme un coup, le pion revient tout seul."
      tools: []
    - project: "food-journal"
      status: "teaser"
    - project: "portfolio"
      heading: "Wireframes"
      points: []
      tools: []
      media:
        - gallery: "rail"
          screens:
            - caption: "Page d'étude de cas"
              src: "portfolio-wire-case-desktop.png"
              device: "desktop"
              alt: "Wireframe desktop de la page d'étude de cas du portfolio sur une grille : la navigation Yassine El Idrissi, le titre, le titre Diagnosis, les blocs Context, Problem, Role et Key insights à côté des emplacements d'image, puis un carrousel et les sections Conception et Results."
            - caption: "La même page, sur téléphone"
              src: "portfolio-wire-case-phone.png"
              device: "phone"
              alt: "Wireframe téléphone de la même page d'étude de cas : la barre Yassine El Idrissi avec son bouton de menu, le titre, Diagnosis, puis les blocs Context, Problem, Role et Key insights empilés au-dessus des emplacements d'image et du bloc de contact."
    - project: "portfolio"
      heading: "Interface haute fidélité"
      points:
        - "J'ai produit les wireframes et les maquettes haute fidélité sur Figma, ainsi que le design system, l'UI kit et les tokens. Le site est mobile first, mais pensé responsive pour des présentations sur ordinateur portable. Les composants sont donc déclinés pour tous les appareils (mobile, tablette, desktop)."
      tools:
        - label: "Figma"
        - label: "Figma MCP"
        - label: "Claude Code"
        - label: "Claude Design"
        - label: "Gemini"
      correction: "Au départ, les captures de mes maquettes données à Gemini perdaient une partie de l'information visuelle, faute d'accès API ou MCP à Figma. Un export JSON de mes tokens a compensé en partie, mais il restait des décalages dus à la perte de contexte. Je les ai corrigés en passant à Claude Code, avec l'intégration du MCP Figma."
      media:
        - gallery: "spotlight"
          screens:
            - caption: "Accueil"
              sub: "Desktop, l'entrée vers les études de cas"
              src: "portfolio-hifi-home-desktop.webp"
              device: "desktop"
              alt: "Page d'accueil du portfolio dans une fenêtre desktop : l'en-tête Yassine El Idrissi, puis le titre Hello, I'm Yassine, l'introduction et le bouton Case studies sur un fond clair."
            - caption: "Cartes d'études de cas"
              sub: "Desktop, la liste des projets, en français"
              src: "portfolio-hifi-cards-desktop.webp"
              device: "desktop"
              alt: "Liste des projets en français sur desktop : la carte Caisse des Dépôts avec sa photo d'atelier, le titre Concevoir un outil agile pour designer avec éthique, le client, la description et le rôle, le bouton Voir le projet, puis la carte suivante qui commence en bas."
            - caption: "Étude de cas, 900.care"
              sub: "Tablette, la lecture longue"
              src: "portfolio-hifi-case-tablet.webp"
              device: "tablet"
              alt: "Étude de cas 900.care sur tablette : le titre UX and growth for a sustainable e-commerce, puis les sections Context, Problem, Role et Key insights avec leurs illustrations."
            - caption: "La même page, sur téléphone"
              sub: "Téléphone, l'étude de cas en une colonne"
              src: "portfolio-hifi-case-phone.webp"
              device: "phone"
              alt: "La même étude de cas 900.care sur téléphone : la barre Yassine El Idrissi avec son bouton de menu, le titre UX and growth for a sustainable e-commerce, le titre Diagnosis, puis les paragraphes Context et Problem empilés sur une seule colonne."
            - caption: "À propos"
              sub: "Téléphone, parcours et contact"
              src: "portfolio-hifi-about-phone.webp"
              device: "phone"
              alt: "Page à propos du portfolio sur téléphone : le titre Product designer, l'introduction, le bouton Let's connect, puis le titre Experience avec le premier poste et les dates."
            - caption: "Contact"
              sub: "Téléphone, l'appel du pied de page"
              src: "portfolio-hifi-footer-phone.webp"
              device: "phone"
              alt: "Pied de page sur téléphone en français : le titre Discutons, la ligne de collaboration, le bouton avec l'adresse e-mail, puis le copyright et le lien LinkedIn."
          figure:
            src: "portfolio-hifi-tokens.png"
            caption: "Variables Figma"
            sub: "Collections primitive et sémantique derrière le fichier de tokens"
            alt: "Panneau Variables de Figma sur la collection Semantic : la colonne Collections liste Primitive avec 123 variables et Semantic avec 71, groupées par couleurs (stroke, background, text), bordure, rayon, épaisseur, espacement et mise en page. Le groupe stroke mappe stroke-primary sur colors/blue-chill/400, stroke-tertiary sur colors/neutral/50 et stroke-neutral-primary sur colors/neutral/300."
